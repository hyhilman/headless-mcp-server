[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/secrets",
    "crates/registry",
    "crates/mcp-wire",
    "crates/mcp-server",
    "crates/transport-stdio",
    "crates/transport-http",
    "crates/backends/backend-stdio",
    "crates/backends/backend-http",
    "crates/server",
]

[workspace.package]
version = "0.0.5"
edition = "2021"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util", "net", "signal", "process"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
futures-core = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
axum = "0.7"
governor = "0.6"
subtle = "2"

[profile.release]
lto = true
codegen-units = 1
