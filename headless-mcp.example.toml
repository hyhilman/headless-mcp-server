# headless-mcp.toml — example configuration
#
# Copy to your working directory or ~/.config/headless-mcp/config.toml
# Then run: headless-mcp auth --all

# ── Auth (optional) ─────────────────────────────────────────────────────
[auth]
# Bearer token for HTTP transport
# hub_token = "{{env:HEADLESS_MCP_TOKEN}}"
rate_limit = 120   # requests/minute per IP

# ── Backend: Slack (20 tools) ───────────────────────────────────────────
[backends.slack]
transport = "http"
url = "https://mcp.slack.com/mcp"
namespace = "slack"
connection_mode = "eager"

[backends.slack.oauth2]
grant_type = "authorization_code"
client_id = "1601185624273.8899143856786"
callback_port = 3118

# ── Backend: Atlassian Jira + Confluence (31 tools) ────────────────────
[backends.atlassian]
transport = "http"
url = "https://mcp.atlassian.com/v1/mcp"
namespace = "jira"
connection_mode = "eager"

[backends.atlassian.oauth2]
grant_type = "authorization_code"
callback_port = 9798
# No client_id — auto-registered via RFC 7591

# ── Backend: Notion (35 tools) ──────────────────────────────────────────
[backends.notion]
transport = "http"
url = "https://mcp.notion.com/mcp"
namespace = "notion"
connection_mode = "eager"

[backends.notion.oauth2]
grant_type = "authorization_code"
callback_port = 9799
# No client_id — auto-registered via RFC 7591

# ── VPN: NetBird (SSO login expires; default 24h) ──────────────────────
# Fixed commands only — agents can pick the VPN by name, never change these.
# [vpn.netbird]
# health = ["netbird", "status"]
# healthy_if = ["Management: Connected"]
# needs_login_if = ["NeedsLogin", "SessionExpired", "LoginFailed"]
# login = ["netbird", "up"]
#
# callback_ports = [53000, 54000]   # paste-back for localhost redirects
# auto_login = true                 # start login when needed; alerts carry the link
#
# Then on any backend reachable only over the VPN:
# requires_vpn = ["netbird"]
# pin_args = { profile = "prod" }   # agents can't change these arguments
# deny_args = ["account_id"]

# [[notify]]
# kind = "slack"                    # or "webhook", "ntfy"
# url = "{{env:SLACK_WEBHOOK_URL}}"

# [events]
# enabled = true                    # MCP Events: signed webhooks on VPN state changes

# ── Expose: Read-only (port 9797) ───────────────────────────────────────
[[expose]]
port = 9797
label = "read-only"
[expose.backends.slack]
tools_allow = ["slack_read_channel", "slack_read_thread", "slack_read_user_profile",
               "slack_search_public", "slack_search_channels", "slack_search_users"]

# ── Expose: Admin (port 9798) ───────────────────────────────────────────
[[expose]]
port = 9798
label = "admin"
# vpn = ["netbird"]          # expose hub.vpn_status / hub.vpn_login on this port
[expose.backends.slack]      # all tools
[expose.backends.atlassian]  # all tools
[expose.backends.notion]     # all tools
