# headless-mcp.toml — example configuration
#
# Copy to your working directory or ~/.config/headless-mcp/config.toml
# Then run: headless-mcp auth --all

# ── Hub settings ────────────────────────────────────────────────────────
[auth]
# Bearer token for HTTP transport (optional)
# hub_token = "{{env:HEADLESS_MCP_TOKEN}}"
rate_limit = 120   # requests/minute per IP

# ── Slack MCP (19 tools) ────────────────────────────────────────────────
[backends.slack]
transport = "http"
url = "https://mcp.slack.com/mcp"
namespace = "slack"
connection_mode = "eager"

[backends.slack.oauth2]
grant_type = "authorization_code"
client_id = "1601185624273.8899143856786"
callback_port = 3118

# ── Atlassian MCP (31 tools — Jira + Confluence) ────────────────────────
[backends.atlassian]
transport = "http"
url = "https://mcp.atlassian.com/v1/mcp"
namespace = "jira"
connection_mode = "eager"

[backends.atlassian.oauth2]
grant_type = "authorization_code"
callback_port = 9798
# No client_id — auto-registered via dynamic client registration (RFC 7591)

# ── Notion MCP (27 tools) ───────────────────────────────────────────────
[backends.notion]
transport = "http"
url = "https://mcp.notion.com/mcp"
namespace = "notion"
connection_mode = "eager"

[backends.notion.oauth2]
grant_type = "authorization_code"
callback_port = 9799
# No client_id — auto-registered via dynamic client registration (RFC 7591)
